# Linked to ~/.config/tmux/tmux.conf. Make sure ~/.tmux.conf does NOT exist:
# tmux reads it first and would ignore this file.

# Truecolor so nvim themes render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"
set -sg escape-time 10      # no lag on <Esc> in nvim
set -g focus-events on      # lets nvim autoread/gitsigns refresh on focus

set -g base-index 1         # windows start at 1
set -g pane-base-index 1
set -g allow-rename off     # keep names set with "prefix ,"
set -g set-titles on
set -g extended-keys on
set -g mouse on

# Prefix: C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splits open in the current pane's directory
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r H resize-pane -L 10
bind -r L resize-pane -R 10

# maximize / restore the current pane
bind -r m resize-pane -Z

# vi copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection     # start selecting with "v"
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle  # toggle block selection
bind -T copy-mode-vi 'y' send -X copy-selection      # copy with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane             # stay in copy mode after mouse drag

# Plugins (install: prefix + I, update: prefix + U)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl-hjkl across tmux panes and nvim splits
set -g @plugin 'jimeh/tmux-themepack'           # status bar theme
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions every 15 minutes


set -g @themepack-status-right-area-middle-format "%a %H:%M"
set -g @themepack-status-right-area-left-format ""
set -g @themepack-status-right-area-right-format "%b %d"

set -g @themepack 'basic'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
